title = "Baby_Boo_Closet gitleaks config"

[allowlist]
description = "Known safe test/example values"
paths = [
  '''^server/data/''',
  '''^public/assets/'''
]

[[rules]]
id = "generic-api-key"
description = "Generic API key/token patterns"
regex = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["']?[A-Za-z0-9_\-]{16,}["']?'''
keywords = ["api_key", "secret", "token", "password"]

[[rules]]
id = "stripe-secret"
description = "Stripe secret key"
regex = '''sk_(live|test)_[0-9a-zA-Z]{16,}'''
keywords = ["sk_live_", "sk_test_"]

[[rules]]
id = "paystack-secret"
description = "Paystack secret key"
regex = '''sk_(live|test)_[0-9a-zA-Z]{16,}'''
keywords = ["paystack", "sk_live_", "sk_test_"]

[[rules]]
id = "supabase-service-role"
description = "Supabase service role key"
regex = '''(?i)(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_KEY)\s*[:=]\s*["']?[A-Za-z0-9._\-]{20,}["']?'''
keywords = ["SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_SERVICE_KEY"]

[[rules]]
id = "private-key-block"
description = "Private key block"
regex = '''-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----'''
keywords = ["BEGIN", "PRIVATE", "KEY"]

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36}'''
keywords = ["github_pat_", "ghp_"]
